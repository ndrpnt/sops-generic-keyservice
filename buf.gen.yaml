version: v2
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: [paths=source_relative, default_api_level=API_OPAQUE]
  - local: protoc-gen-pluginrpc-go
    out: internal/gen
    opt: paths=source_relative
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ndrpnt/sops-generic-keyservice/internal/gen
clean: true
